name: Run Starving Agent

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make sure the wallet exists
        run: python balance.py

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python main.py

      - name: Save the agent's updated balance
        run: |
          git config user.name "starving-agent"
          git config user.email "actions@github.com"
          git add data/balance.json posts/ || true
          git diff --staged --quiet || git commit -m "agent run: update balance"
          git pull --rebase origin main
          git push
